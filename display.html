<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จอมอนิเตอร์สกอร์ 3x3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* จอใหญ่สำหรับมอนิเตอร์ / โปรเจกเตอร์ ปรับขนาดตามจออัตโนมัติ (ออกแบบสำหรับ 16:9)
   กด F เพื่อเต็มจอ */
:root{
  --bg:#07090a; --panel:#12171a; --ink:#f1f4f5; --mute:#9aa7af; --line:#27303a;
  --led:#ffb020; --alert:#ff5a44; --good:#4cc38a; --info:#7aa7ff; --ball:#e8590c;
  --display:'Big Shoulders Display','Impact','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,sans-serif;
  --mono:'Chakra Petch','IBM Plex Sans Thai',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{font-size:24px}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font:500 1rem/1.25 var(--body);cursor:none}
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.9rem;padding:1.1rem 2rem 1.2rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--mute);font-size:1.05rem}
header b{font:900 1.8rem/1 var(--display);color:var(--ink);letter-spacing:.02em;margin-right:.6rem}
#conn{color:var(--alert);font-weight:600}
main{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:1.4rem;min-height:0}

.tp{background:var(--panel);border-radius:.9rem;overflow:hidden;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);min-height:0}
.th{background:var(--c);padding:.7rem 1.1rem;display:flex;align-items:center;gap:.8rem;min-width:0}
.th .n{font:700 2.1rem/1.1 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ball{
  width:1.6rem;height:1.6rem;border-radius:50%;flex:none;
  background:
    linear-gradient(#3a1a08,#3a1a08) center/100% 3px no-repeat,
    linear-gradient(#3a1a08,#3a1a08) center/3px 100% no-repeat,
    var(--ball);
  box-shadow:0 0 0 3px rgba(255,255,255,.3);
}
.sc{font:900 15rem/.9 var(--display);text-align:center;padding:1rem 0 .4rem;font-variant-numeric:tabular-nums}
.ft{padding:.2rem 1.1rem .8rem;display:grid;gap:.45rem}
.fl{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.fl .l{color:var(--mute);font-size:1.05rem}
.fl .v{font:800 2.4rem/1 var(--display)}
.fl .st{font-size:1.05rem;color:var(--mute)}
.fl .st.bonus{color:var(--led);font-weight:700}
.fl .st.max{color:var(--alert);font-weight:700}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:.25rem}
.pip{height:1.5rem;border-radius:.3rem;border:2px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--mono);color:var(--mute)}
.pip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pip.on.bonus{background:var(--led);border-color:var(--led);color:#1a1200}
.pip.on.max{background:var(--alert);border-color:var(--alert);color:#1b0a08}
.pl{padding:.6rem 1.1rem 1rem;display:grid;align-content:start;gap:.15rem;border-top:1px solid var(--line);min-height:0;overflow:hidden}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;font-size:1.2rem;padding:.2rem 0}
.pr .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pr .pf{font:600 1.05rem var(--mono);color:var(--mute);white-space:nowrap}
.pr.dq .pn{text-decoration:line-through;color:var(--mute)}
.pr.dq .pf{color:var(--alert)}
.pr.zero .pf{opacity:.45}

.cp{background:var(--panel);border-radius:.9rem;display:grid;align-content:center;justify-items:center;gap:.9rem;padding:1rem 1.2rem;text-align:center;min-width:0}
.lab{color:var(--mute);font-size:1.05rem;letter-spacing:.05em}
.g{font:700 7rem/1 var(--mono);color:var(--led);font-variant-numeric:tabular-nums}
.s{font:700 5.6rem/1 var(--mono);color:var(--led);font-variant-numeric:tabular-nums}
.s.low{color:var(--alert)}
.s.zero{color:var(--alert);animation:blink .6s steps(2) infinite}
.run{font-size:1.05rem;padding:.2rem 1rem;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.run.on{background:var(--good);color:#06170e;border-color:transparent;font-weight:700}
.toc{font:700 1.8rem/1 var(--mono);color:var(--led)}
.poss{display:flex;align-items:center;gap:.6rem;font-size:1.3rem;min-height:1.7rem}
@keyframes blink{50%{opacity:.25}}

.banner{min-height:4.6rem;border-radius:.9rem;background:var(--panel);border-left:.6rem solid var(--led);padding:.7rem 1.4rem;display:grid;align-content:center;gap:.1rem}
.banner.idle{border-left-color:var(--line);color:var(--mute)}
.banner.high{border-left-color:var(--alert)}
.banner.final{border-left-color:var(--good)}
.banner.info{border-left-color:var(--info)}
.banner .t{font:700 1.7rem/1.2 var(--body)}
.banner .x{font:500 1.2rem/1.3 var(--body);color:var(--mute)}
@media (prefers-reduced-motion:reduce){.s.zero{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><b>3×3</b><span id="phase">รอข้อมูลจากหน้าคุมสกอร์</span></div>
    <span id="conn" hidden>ขาดการเชื่อมต่อ กำลังต่อใหม่…</span>
  </header>
  <main>
    <section class="tp" id="tpA">
      <div class="th"><div class="n" id="nA">ทีม A</div><i class="ball" id="bA" hidden></i></div>
      <div class="sc" id="sA">0</div>
      <div class="ft">
        <div class="fl"><span class="l">ฟาวล์ทีม</span><span class="v" id="fA">0</span><span class="st" id="fsA"></span></div>
        <div class="pips" id="pipA"></div>
      </div>
      <div class="pl" id="plA"></div>
    </section>
    <section class="cp">
      <div><div class="lab">เวลาเกม</div><div class="g" id="g">10:00</div></div>
      <div><div class="lab">ช็อตคล็อก</div><div class="s" id="s">12</div></div>
      <div class="run" id="run">หยุดเวลา</div>
      <div class="toc" id="toc" hidden></div>
      <div class="poss" id="poss"></div>
    </section>
    <section class="tp" id="tpB">
      <div class="th"><div class="n" id="nB">ทีม B</div><i class="ball" id="bB" hidden></i></div>
      <div class="sc" id="sB">0</div>
      <div class="ft">
        <div class="fl"><span class="l">ฟาวล์ทีม</span><span class="v" id="fB">0</span><span class="st" id="fsB"></span></div>
        <div class="pips" id="pipB"></div>
      </div>
      <div class="pl" id="plB"></div>
    </section>
  </main>
  <div class="banner idle" id="banner"><div class="t" id="bT">พร้อมแข่งขัน</div><div class="x" id="bX"></div></div>
</div>

<script>
(function(){
'use strict';
function fit(){ document.documentElement.style.fontSize=Math.min(window.innerWidth/80,window.innerHeight/45)+'px'; }
fit(); window.addEventListener('resize',fit);

function $(id){return document.getElementById(id);}
function pad2(n){return (n<10?'0':'')+n;}
function fmtGame(ms){
  if(ms>=60000){var s=Math.ceil(ms/1000);return pad2(Math.floor(s/60))+':'+pad2(s%60);}
  return (Math.floor(ms/100)/10).toFixed(1);
}
function fmtShot(ms){return ms>5000?String(Math.ceil(ms/1000)):(Math.floor(ms/100)/10).toFixed(1);}
function setText(el,t){ if(el.textContent!==t) el.textContent=t; }

for(var k=0;k<2;k++){
  var box=$(k?'pipB':'pipA');
  for(var n=1;n<=10;n++){ var sp=document.createElement('span'); sp.className='pip'; sp.textContent=n; box.appendChild(sp); }
}

var st=null, recv=0, plKey=['',''];
function foulStatus(tf){
  if(tf>=10) return ['max','ฟาวล์ปกติ = 2 ลูกโทษ + ครองบอล'];
  if(tf>=7) return ['bonus','โบนัส · ฟาวล์ปกติ = 2 ลูกโทษ'];
  if(tf===6) return ['','ฟาวล์ถัดไปเป็นโบนัส'];
  return ['','อีก '+(7-tf)+' ฟาวล์ถึงโบนัส'];
}
function renderTeam(i,t){
  var k=i?'B':'A';
  $('tp'+k).style.setProperty('--c',t.color);
  setText($('n'+k),t.name); setText($('s'+k),String(t.score)); setText($('f'+k),String(t.fouls));
  $('b'+k).hidden=(st.poss!==i);
  var fs=foulStatus(t.fouls), el=$('fs'+k); setText(el,fs[1]); el.className='st '+fs[0];
  var pips=$('pip'+k).children;
  for(var n=0;n<10;n++){
    var on=n<t.fouls; pips[n].className='pip'+(on?' on':'')+(on&&n>=6&&n<9?' bonus':'')+(on&&n>=9?' max':'');
  }
  var key=JSON.stringify(t.players);
  if(plKey[i]!==key){
    plKey[i]=key;
    var box=$('pl'+k); box.textContent='';
    t.players.forEach(function(p){
      var row=document.createElement('div'); row.className='pr'+(p.dq?' dq':'')+((p.p+p.u+p.t+p.d)===0?' zero':'');
      var nm=document.createElement('span'); nm.className='pn'; nm.textContent=p.name;
      var parts=[]; if(p.p) parts.push('P'+p.p); if(p.u) parts.push('U'+p.u); if(p.t) parts.push('T'+p.t); if(p.d) parts.push('D'+p.d);
      var pf=document.createElement('span'); pf.className='pf'; pf.textContent=p.dq?'ตัดสิทธิ์ '+parts.join(' '):(parts.length?parts.join(' '):'—');
      row.appendChild(nm); row.appendChild(pf); box.appendChild(row);
    });
  }
}
function render(){
  if(!st) return;
  var el=performance.now()-recv;
  renderTeam(0,st.teams[0]); renderTeam(1,st.teams[1]);
  var g=st.gameMs, s=st.shotMs;
  if(st.running){ if(st.phase==='regulation') g=Math.max(0,g-el); s=Math.max(0,s-el); }
  setText($('g'),st.phase==='overtime'?'OT':fmtGame(g));
  var sv=$('s'); setText(sv,fmtShot(s)); sv.className='s'+(s<=0?' zero':(s<=5000?' low':''));
  var ph={regulation:'เวลาปกติ · ทีมแรกถึง 21 คะแนนชนะ',tied:'เสมอ · รอต่อเวลา',overtime:'ต่อเวลา · ทีมแรกถึง '+st.target+' คะแนนชนะ',final:'จบเกม'}[st.phase]||'';
  setText($('phase'),ph);
  var run=$('run'); setText(run,st.running?'เวลาเดิน':'หยุดเวลา'); run.className='run'+(st.running?' on':'');
  var toc=$('toc');
  if(st.timeout&&st.timeout.ms-el>0){ toc.hidden=false; setText(toc,'เวลานอก '+st.teams[st.timeout.team].name+' · '+Math.ceil((st.timeout.ms-el)/1000)+' วิ'); }
  else toc.hidden=true;
  setText($('poss'),st.poss===null?'':'ครองบอล: '+st.teams[st.poss].name);
  var b=$('banner'), bn=st.banner;
  if(bn){
    b.className='banner '+(bn.kind==='foul'&&bn.high?'high':bn.kind||'');
    setText($('bT'),bn.title); setText($('bX'),bn.text||'');
  } else {
    b.className='banner idle'; setText($('bT'),st.running?'เกมกำลังแข่งขัน':'หยุดเวลา'); setText($('bX'),'');
  }
}

var conn=$('conn');
function connect(){
  var es=new EventSource('/events?role=display');
  es.onopen=function(){ conn.hidden=true; };
  es.onerror=function(){ conn.hidden=false; };
  es.onmessage=function(e){ try{ st=JSON.parse(e.data); recv=performance.now(); conn.hidden=true; render(); }catch(_){} };
}
connect();
setInterval(render,100);

document.addEventListener('keydown',function(e){
  if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement) document.exitFullscreen&&document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  }
});
document.addEventListener('mousemove',function(){ document.body.style.cursor='default'; clearTimeout(window.__c); window.__c=setTimeout(function(){document.body.style.cursor='none';},2000); });
})();
</script>
</body>
</html>
