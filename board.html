<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โอเวอร์เลย์สกอร์บอร์ดสนาม 3x3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@500;600;700&display=swap">
<style>
/* โอเวอร์เลย์พื้นหลังโปร่งใส สไตล์สกอร์บอร์ดกลางสนาม
   พารามิเตอร์ใน URL (ใช้ได้ทุกตัว ต่อด้วย & ):
     ?event=ชื่อรายการ   ข้อความซ้ายของแถบหัว  (ค่าเริ่มต้น 3x3 BASKETBALL)
     &tag=ข้อความขวา      ข้อความขวาของแถบหัว  (ค่าเริ่มต้น SCOREBOARD)
     &round=รอบ/แมตช์     เช่น รอบรองชนะเลิศ | เกม 4  (ถ้าไม่ใส่ จะแสดงสถานะเกม)
     &logo=https://...    รูปโลโก้/สปอนเซอร์ในช่องล่างกลาง (ถ้าไม่ใส่ จะแสดงสถานะ)
     &pos=bottom          วางด้านล่างจอ
     &scale=1.2           ขยาย/ย่อ
     &bg=%23556677        สีพื้นหลังไว้ทดสอบในเบราว์เซอร์ (OBS/vMix ไม่ต้องใส่) */
:root{
  --p1:#1d2125; --p2:#0b0d0f; --edge:#4b545c; --edge2:#8c979f;
  --ink:#f4f6f7; --mute:#a5b0b7; --amber:#ffb020; --alert:#ff5a44; --good:#4cc38a; --info:#7aa7ff; --ball:#e8590c;
  --display:'Big Shoulders Display','Impact','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,sans-serif;
  --mono:'Chakra Petch','IBM Plex Sans Thai',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{font-size:19.2px}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body{font:600 1rem/1.2 var(--body);color:var(--ink)}

#stage{position:absolute;left:50%;transform:translateX(-50%);width:58rem;display:grid;gap:.5rem;transition:opacity .4s ease,transform .4s ease}
body.pos-top #stage{top:1.8rem}
body.pos-bottom #stage{bottom:1.8rem}
body.pos-bottom .alert{order:-1}
#stage.off{opacity:0;transform:translate(-50%,-1.5rem)}
body.pos-bottom #stage.off{transform:translate(-50%,1.5rem)}

.panel{
  background:linear-gradient(180deg,var(--p1),var(--p2));
  border:2px solid var(--edge);border-radius:.9rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 1.2rem rgba(0,0,0,.6),0 .5rem 1.6rem rgba(0,0,0,.5);
}

/* แถบหัว */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:1.4rem;height:3.7rem;padding:0 1.8rem}
.head .t{font:700 1.7rem/1 var(--display);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .l{text-align:right}
.head .r{text-align:left}
.mark{
  font:900 italic 3.2rem/1 var(--display);letter-spacing:.02em;padding:0 .4rem;
  background:linear-gradient(180deg,#f4f6f7 0%,#9aa6ae 48%,#dfe5e8 52%,#6b767e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .1rem .2rem rgba(0,0,0,.6));
}

/* แถวหลัก */
.row{display:grid;grid-template-columns:minmax(0,1fr) 15.5rem minmax(0,1fr);gap:.5rem}

/* แผงทีม */
.tm{--c:#2457d6;--led:#4a7bff;padding:.9rem 1.1rem 1rem;display:grid;grid-template-columns:minmax(0,1fr);gap:.75rem;align-content:start;min-width:0;transition:box-shadow .4s}
.tm.win{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 .18rem var(--good),0 0 2rem rgba(76,195,138,.5)}
.nm{display:flex;align-items:center;gap:.7rem;min-width:0}
.sw{width:2.1rem;height:1.45rem;border-radius:.25rem;background:var(--c);border:2px solid rgba(255,255,255,.55);flex:none}
.tn{flex:1;min-width:0;text-align:center;font:700 1.75rem/1.15 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ind{display:flex;gap:.4rem;align-items:center;flex:none;min-width:2.1rem;justify-content:flex-end}
.ball{
  width:1.15rem;height:1.15rem;border-radius:50%;
  background:
    linear-gradient(#3a1a08,#3a1a08) center/100% 2px no-repeat,
    linear-gradient(#3a1a08,#3a1a08) center/2px 100% no-repeat,
    var(--ball);
  box-shadow:0 0 0 2px rgba(255,255,255,.3);
}
.ball[hidden]{display:none}
.to{width:.85rem;height:.85rem;border-radius:50%;border:2px solid var(--mute)}
.to.used{background:var(--mute)}
.led{
  background:#060708;border:2px solid var(--led);border-radius:.7rem;padding:.4rem .6rem;
  box-shadow:0 0 1.1rem color-mix(in srgb,var(--led) 55%,transparent),inset 0 0 1.2rem rgba(0,0,0,.9);
}
.led canvas{display:block;width:100%;height:8.3rem}
.fouls{display:flex;align-items:center;gap:.6rem;min-width:0;font:700 1.15rem/1 var(--body);white-space:nowrap}
.fouls .n{font:800 2.2rem/1 var(--display);color:var(--led);min-width:1.4ch;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:.35rem;flex:1;align-items:center;min-width:0}
.dot{width:.72rem;height:.72rem;flex:none;border-radius:50%;background:rgba(255,255,255,.14)}
.dot.on{background:#fff;box-shadow:0 0 .5rem rgba(255,255,255,.7)}
.dot.on.bonus{background:var(--amber);box-shadow:0 0 .55rem var(--amber)}
.dot.on.max{background:var(--alert);box-shadow:0 0 .55rem var(--alert)}
.bn{font:800 .8rem/1 var(--mono);padding:.25rem .45rem;flex:none;border-radius:.3rem;background:var(--amber);color:#1a1200;white-space:nowrap}
.bn.max{background:var(--alert);color:#1b0a08}
.bn[hidden]{display:none}

/* แผงกลาง */
.ct{padding:.8rem .9rem;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:.55rem}
.stg{text-align:center;font:700 .95rem/1.2 var(--body);letter-spacing:.09em;color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{background:#050607;border:2px solid #2a3137;border-radius:.55rem;box-shadow:inset 0 0 .9rem rgba(0,0,0,.9);display:grid;place-items:center}
.g{font:700 4rem/1 var(--mono);padding:.45rem 0;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 .6rem rgba(255,255,255,.25)}
.sbx{border-color:rgba(255,176,32,.55)}
.s{font:700 3.6rem/1 var(--mono);padding:.4rem 0;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 .7rem rgba(255,176,32,.35)}
.s.low{color:var(--alert);text-shadow:0 0 .7rem rgba(255,90,68,.45)}
.s.zero{color:var(--alert);animation:blink .6s steps(2) infinite}
.s[hidden]{display:none}
.sbx[hidden]{display:none}
.info{padding:.5rem .6rem;text-align:center;font:700 1.15rem/1.3 var(--body);min-height:3.6rem;overflow:hidden}
.info img{max-width:100%;max-height:3.2rem;display:block}
.info.tmo{color:var(--amber);font:700 1.5rem/1.2 var(--mono)}
.info small{display:block;font:500 .85rem/1.2 var(--body);color:var(--mute)}
@keyframes blink{50%{opacity:.25}}

/* แถบแจ้งผล */
.alert{display:grid;gap:.2rem;padding:.7rem 1.5rem;border-left:.55rem solid var(--amber);animation:pop .3s ease}
.alert[hidden]{display:none}
.alert.high{border-left-color:var(--alert)}
.alert.final{border-left-color:var(--good)}
.alert.info{border-left-color:var(--info)}
.alert .at{font:700 1.4rem/1.2 var(--body)}
.alert .ax{font:500 1.1rem/1.3 var(--body);color:var(--mute)}
@keyframes pop{from{opacity:0;transform:translateY(-.4rem)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.alert,.s.zero{animation:none}#stage{transition:none}}
</style>
</head>
<body class="pos-top">
<div id="stage" class="off">
  <div class="panel head">
    <div class="t l" id="hl">3x3 BASKETBALL</div>
    <div class="mark" aria-hidden="true">3×3</div>
    <div class="t r" id="hr">SCOREBOARD</div>
  </div>

  <div class="row">
    <section class="panel tm" id="tA">
      <div class="nm"><i class="sw"></i><div class="tn" id="nA">ทีม A</div><div class="ind"><i class="ball" id="bA" hidden></i><i class="to" id="oA" title="เวลานอก"></i></div></div>
      <div class="led"><canvas id="cA" aria-label="คะแนนทีม A"></canvas></div>
      <div class="fouls"><span>ฟาวล์</span><span class="n" id="fA">0</span><div class="dots" id="dA"></div><span class="bn" id="xA" hidden>BONUS</span></div>
    </section>

    <section class="panel ct">
      <div class="stg" id="stg">เวลาปกติ</div>
      <div class="box"><div class="g" id="g">10:00</div></div>
      <div class="box sbx" id="sbx"><div class="s" id="s">12</div></div>
      <div class="box info" id="info"></div>
    </section>

    <section class="panel tm" id="tB">
      <div class="nm"><i class="sw"></i><div class="tn" id="nB">ทีม B</div><div class="ind"><i class="ball" id="bB" hidden></i><i class="to" id="oB" title="เวลานอก"></i></div></div>
      <div class="led"><canvas id="cB" aria-label="คะแนนทีม B"></canvas></div>
      <div class="fouls"><span>ฟาวล์</span><span class="n" id="fB">0</span><div class="dots" id="dB"></div><span class="bn" id="xB" hidden>BONUS</span></div>
    </section>
  </div>

  <div class="panel alert" id="alert" hidden><div class="at" id="aT"></div><div class="ax" id="aX"></div></div>
</div>

<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search);
var scale=parseFloat(q.get('scale'))||1;
document.body.className='pos-'+(q.get('pos')==='bottom'?'bottom':'top');
if(q.get('bg')) document.body.style.background=q.get('bg');
if(q.get('event')) document.getElementById('hl').textContent=q.get('event');
if(q.get('tag')) document.getElementById('hr').textContent=q.get('tag');
var ROUND=q.get('round')||'', LOGO=q.get('logo')||'';
function fit(){ document.documentElement.style.fontSize=(window.innerWidth/100*scale)+'px'; ledKey=['','']; }
fit(); window.addEventListener('resize',fit);

function $(id){return document.getElementById(id);}
function pad2(n){return (n<10?'0':'')+n;}
function fmtGame(ms){
  if(ms>=60000){var s=Math.ceil(ms/1000);return pad2(Math.floor(s/60))+':'+pad2(s%60);}
  return (Math.floor(ms/100)/10).toFixed(1);
}
function fmtShot(ms){return ms>5000?String(Math.ceil(ms/1000)):(Math.floor(ms/100)/10).toFixed(1);}
function setText(el,t){ if(el.textContent!==t) el.textContent=t; }

/* ---- สีไฟ LED: ดึงสีทีมให้สว่างพอบนพื้นดำ ---- */
function ledColor(hex){
  var m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#ffb020';
  var n=parseInt(m[1],16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, h=0, s=0, d=mx-mn;
  if(d){
    s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); h*=60;
  }
  s=Math.max(s,.72); l=Math.max(l,.6);
  return 'hsl('+Math.round(h)+','+Math.round(s*100)+'%,'+Math.round(l*100)+'%)';
}

/* ---- ตัวเลขจุด 5x7 ---- */
var FONT={
 '0':['01110','10001','10011','10101','11001','10001','01110'],
 '1':['00100','01100','00100','00100','00100','00100','01110'],
 '2':['01110','10001','00001','00010','00100','01000','11111'],
 '3':['11110','00001','00001','01110','00001','00001','11110'],
 '4':['00010','00110','01010','10010','11111','00010','00010'],
 '5':['11111','10000','11110','00001','00001','10001','01110'],
 '6':['00110','01000','10000','11110','10001','10001','01110'],
 '7':['11111','00001','00010','00100','01000','01000','01000'],
 '8':['01110','10001','10001','01110','10001','10001','01110'],
 '9':['01110','10001','10001','01111','00001','00010','01100']
};
var ledKey=['',''];
function drawLed(i,score,color){
  var cv=$(i?'cB':'cA'), w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return;
  var key=score+'|'+color+'|'+w+'x'+h;
  if(ledKey[i]===key) return; ledKey[i]=key;
  var dpr=window.devicePixelRatio||1;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  var c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  var txt=String(Math.max(0,score)); while(txt.length<2) txt='0'+txt;
  var n=txt.length, cols=n*5+(n-1);
  var cell=Math.min(w*.94/cols,h*.9/7), ox=(w-cols*cell)/2, oy=(h-7*cell)/2, r=cell*.41;
  for(var d=0;d<n;d++){
    var g=FONT[txt[d]];
    for(var y=0;y<7;y++) for(var x=0;x<5;x++){
      var on=g[y][x]==='1', cx=ox+(d*6+x+.5)*cell, cy=oy+(y+.5)*cell;
      c.beginPath(); c.arc(cx,cy,r,0,6.2832);
      if(on){ c.shadowColor=color; c.shadowBlur=cell*.7; c.fillStyle=color; }
      else { c.shadowBlur=0; c.fillStyle='rgba(255,255,255,.07)'; }
      c.fill();
    }
  }
  c.shadowBlur=0;
}

/* ---- จุดฟาวล์ ---- */
['dA','dB'].forEach(function(id){
  var box=$(id);
  for(var n=0;n<7;n++){ var s=document.createElement('i'); s.className='dot'; box.appendChild(s); }
});

var st=null, recv=0;
function teamUI(i,t){
  var k=i?'B':'A', root=$('t'+k), col=ledColor(t.color);
  root.style.setProperty('--c',t.color); root.style.setProperty('--led',col);
  setText($('n'+k),t.name);
  drawLed(i,t.score,col);
  setText($('f'+k),String(t.fouls));
  var dots=$('d'+k).children, tf=t.fouls;
  for(var n=0;n<7;n++){
    var on=n<tf; dots[n].className='dot'+(on?' on':'')+(on&&tf>=10?' max':(on&&tf>=7?' bonus':''));
  }
  var bn=$('x'+k); bn.hidden=(tf<7);
  bn.className='bn'+(tf>=10?' max':'');
  $('b'+k).hidden=(st.poss!==i);
  $('o'+k).className='to'+(t.timeout?' used':'');
  root.classList.toggle('win',st.phase==='final'&&st.winner===i);
}
function render(){
  if(!st) return;
  var el=performance.now()-recv, o=st.overlay||{show:true,shot:true,fouls:true,banner:true};
  $('stage').classList.toggle('off',o.show===false);
  teamUI(0,st.teams[0]); teamUI(1,st.teams[1]);
  $('tA').querySelector('.fouls').hidden=(o.fouls===false);
  $('tB').querySelector('.fouls').hidden=(o.fouls===false);

  var g=st.gameMs, s=st.shotMs;
  if(st.running){ if(st.phase==='regulation') g=Math.max(0,g-el); s=Math.max(0,s-el); }
  setText($('g'),st.phase==='overtime'?'OT':fmtGame(g));
  $('sbx').hidden=(o.shot===false);
  var sv=$('s'); setText(sv,fmtShot(s)); sv.className='s'+(s<=0?' zero':(s<=5000?' low':''));

  var phase={regulation:'เวลาปกติ',tied:'เสมอ · รอต่อเวลา',overtime:'ต่อเวลา · ถึง '+st.target+' ชนะ',final:'จบเกม'}[st.phase]||'';
  setText($('stg'),ROUND||phase);

  var info=$('info'), kind, html;
  var tms=st.timeout?st.timeout.ms-el:0;
  if(st.timeout&&tms>0){ kind='tmo:'+st.timeout.team+':'+Math.ceil(tms/1000); }
  else if(st.phase==='final'&&st.winner!==null&&st.winner!==undefined){ kind='win:'+st.teams[st.winner].name; }
  else if(LOGO&&st.phase!=='tied'){ kind='logo'; }
  else if(st.poss!==null&&st.poss!==undefined){ kind='poss:'+st.teams[st.poss].name; }
  else kind='idle:'+(ROUND?phase:'');
  if(info.dataset.k!==kind){
    info.dataset.k=kind; info.textContent=''; info.className='box info';
    var p=kind.split(':');
    if(p[0]==='tmo'){ info.classList.add('tmo'); info.textContent='เวลานอก '+p[2]; var sm=document.createElement('small'); sm.textContent=st.teams[+p[1]].name; info.appendChild(sm); }
    else if(p[0]==='win'){ info.textContent=kind.slice(4)+' ชนะ'; }
    else if(p[0]==='logo'){ var im=document.createElement('img'); im.alt=''; im.src=LOGO; info.appendChild(im); }
    else if(p[0]==='poss'){ info.textContent=kind.slice(5); var s2=document.createElement('small'); s2.textContent='ครองบอล'; info.appendChild(s2); }
    else { info.textContent=kind.slice(5)||'3×3'; }
  }

  var al=$('alert'), bn=st.banner;
  if(bn&&o.banner!==false){
    al.hidden=false; al.className='panel alert '+(bn.kind==='foul'&&bn.high?'high':(bn.kind||''));
    setText($('aT'),bn.title); setText($('aX'),bn.text||''); $('aX').hidden=!bn.text;
  } else al.hidden=true;
}

var es=new EventSource('/events?role=overlay');
es.onmessage=function(e){ try{ st=JSON.parse(e.data); recv=performance.now(); render(); }catch(_){} };
setInterval(render,100);
})();
</script>
</body>
</html>
